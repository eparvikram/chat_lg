<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Simple AI Chatbot</title>
    <style>
        body {
            font-family: sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-color: #f0f2f5;
            margin: 0;
        }
        .chat-container {
            width: 90%;
            max-width: 600px;
            background-color: #ffffff;
            border-radius: 8px;
            box-shadow: 0 4px 8px rgba(0, 0, 0, 0.1);
            overflow: hidden;
            display: flex;
            flex-direction: column;
            height: 80vh;
            max-height: 700px; /* Limit height for smaller screens */
        }
        .chat-history {
            flex-grow: 1;
            padding: 20px;
            overflow-y: auto;
            border-bottom: 1px solid #eee;
        }
        .message {
            margin-bottom: 15px;
            padding: 10px 15px;
            border-radius: 20px;
            max-width: 75%;
            word-wrap: break-word;
        }
        .message.user {
            background-color: #007bff;
            color: white;
            align-self: flex-end; /* Push to the right */
            margin-left: auto;
            border-bottom-right-radius: 5px;
        }
        .message.ai {
            background-color: #e2e2e2;
            color: #333;
            align-self: flex-start; /* Push to the left */
            margin-right: auto;
            border-bottom-left-radius: 5px;
        }
        .chat-input {
            display: flex;
            padding: 15px;
            border-top: 1px solid #eee;
        }
        .chat-input input[type="text"] {
            flex-grow: 1;
            padding: 10px 15px;
            border: 1px solid #ccc;
            border-radius: 20px;
            outline: none;
            font-size: 16px;
        }
        .chat-input button {
            background-color: #28a745;
            color: white;
            border: none;
            border-radius: 20px;
            padding: 10px 20px;
            margin-left: 10px;
            cursor: pointer;
            font-size: 16px;
            transition: background-color 0.2s;
        }
        .chat-input button:hover {
            background-color: #218838;
        }
    </style>
</head>
<body>
    <div class="chat-container">
        <div class="chat-history" id="chatHistory">
            </div>
        <div class="chat-input">
            <input type="text" id="userInput" placeholder="Type your message...">
            <button id="sendButton">Send</button>
        </div>
    </div>

    <script>
        const chatHistory = document.getElementById('chatHistory');
        const userInput = document.getElementById('userInput');
        const sendButton = document.getElementById('sendButton');

        // --- IMPORTANT: Configure your Docker AI URL here ---
        // Replace 'localhost' with your Docker host IP if not running locally.
        // Replace '8000' with the port you mapped your Docker container's internal port to.
        const AI_API_URL = 'http://localhost:8000/chat'; 
        // If your AI endpoint is different (e.g., just '/'), adjust accordingly.

        function addMessage(sender, text) {
            const messageDiv = document.createElement('div');
            messageDiv.classList.add('message');
            messageDiv.classList.add(sender); // 'user' or 'ai'
            messageDiv.textContent = text;
            chatHistory.appendChild(messageDiv);
            // Scroll to the bottom of the chat
            chatHistory.scrollTop = chatHistory.scrollHeight;
        }

        async function sendMessage() {
            const message = userInput.value.trim();
            if (message === '') return;

            addMessage('user', message);
            userInput.value = ''; // Clear input

            try {
                // Show a temporary "typing..." message
                const typingIndicator = document.createElement('div');
                typingIndicator.classList.add('message', 'ai');
                typingIndicator.textContent = 'AI is typing...';
                typingIndicator.id = 'typingIndicator';
                chatHistory.appendChild(typingIndicator);
                chatHistory.scrollTop = chatHistory.scrollHeight;


                const response = await fetch(AI_API_URL, {
                    method: 'POST',
                    headers: {
                        'Content-Type': 'application/json',
                        // If your Docker AI requires API keys or authentication, add them here:
                        // 'Authorization': 'Bearer YOUR_API_KEY'
                    },
                    body: JSON.stringify({ message: message })
                });

                if (!response.ok) {
                    throw new Error(`HTTP error! status: ${response.status}`);
                }

                const data = await response.json();
                
                // Remove the typing indicator
                if (typingIndicator.parentNode) {
                    typingIndicator.parentNode.removeChild(typingIndicator);
                }

                addMessage('ai', data.response); // Assuming AI response is in data.response
            } catch (error) {
                console.error('Error sending message to AI:', error);
                // Remove the typing indicator if an error occurred
                const existingTypingIndicator = document.getElementById('typingIndicator');
                if (existingTypingIndicator && existingTypingIndicator.parentNode) {
                     existingTypingIndicator.parentNode.removeChild(existingTypingIndicator);
                }
                addMessage('ai', 'Error: Could not connect to AI or get a response. ' + error.message);
            }
        }

        sendButton.addEventListener('click', sendMessage);
        userInput.addEventListener('keypress', (event) => {
            if (event.key === 'Enter') {
                sendMessage();
            }
        });

        // Initial welcome message
        addMessage('ai', 'Hello! How can I assist you today?');
    </script>
</body>
</html>
